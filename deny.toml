# cargo-deny configuration. Run by `just audit` and by the supply-chain CI job.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Exceptions are recorded with a reason and an owner, never with a blanket
# severity downgrade.
ignore = [
    # `paste` is unmaintained. It is a proc-macro with no runtime surface,
    # reached only through candle-core's `gemm` and through `tokenizers`; there
    # is no safe upgrade, and the maintained forks are not what those crates
    # depend on. Revisit when candle moves off it.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro only, transitive through candle-core; no upgrade available" },
]

[licenses]
version = 2
# The project is MIT, and both shipped models are Apache 2.0 (§22.1). The list
# below is what a dependency may be, not what the project is.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Two SQLite builds in one process is not a dependency question, it is a
# corruption question: §11 assumes exactly one library owns the file.
deny = [
    { crate = "libsqlite3-sys", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
