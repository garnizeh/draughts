# The jobs that are too slow, too large, or too device-dependent to gate a
# merge, but whose absence would let a property decay silently.

name: Nightly

on:
  schedule:
    # 03:00 UTC. Nothing depends on the hour; it is off-peak for the runners.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo. The baselines job
# only needs to upload its own workflow artifact, which contents: read permits.
permissions:
  contents: read

# A scheduled run and a `workflow_dispatch` of the same suite would otherwise
# race for the same runners and produce two baselines for one night.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # §5.4: "a nightly CI job runs the golden-search suite with the table off to
  # prove the cache is not load-bearing for correctness."
  #
  # `DRAUGHTS_TT_DISABLED` has no reader yet: it is meant for the §20.5
  # differential search test, and tree search (src/engine/mcts.rs) is still
  # `todo!()`. Until that test exists and reads it, this job runs the same
  # suite as `just test` — a documented, in-scope-later gap (CHANGELOG.md),
  # not a defect to paper over with a fake consumer.
  transposition-off:
    name: correctness with the table disabled
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just test-tt-off

  # §20.4: a million games, five million sampled rows, and a peak-RSS gate.
  # Minutes to hours — never a merge gate.
  #
  # Disabled for now: every test body in tests/load.rs is `todo!()` (the
  # writer actor and lab runner they exercise don't exist yet), so this job
  # would fail on every scheduled run rather than reporting a real load-test
  # result. `if: false` is what actionlint flags as a "constant expression" —
  # commented out instead, which is what it was asking for. Uncomment once
  # those seams are implemented.
  #
  # load:
  #   name: load and volume (§20.4)
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 180
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  #       with:
  #         persist-credentials: false
  #     - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
  #       with:
  #         toolchain: "1.98.0"
  #     - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
  #     - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
  #     - run: just test-load

  # §20.9: baselines are tracked as committed numbers, not pass/fail assertions.
  # The artefact is the point; a run that is slower than yesterday is a question,
  # not a failure.
  baselines:
    name: performance baselines (§20.9)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - run: just bench -- --save-baseline nightly

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baselines-${{ github.run_id }}
          path: target/criterion/
          retention-days: 30

  # The dependency graph moves under the project even when the project does not.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories
