version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These move together and are tested together; separate PRs for each is
      # noise, not signal.
      tokio-stack:
        patterns: ['tokio*', 'axum*', 'tower*', 'hyper*']
      candle:
        patterns: ['candle-*', 'tokenizers', 'cudarc']
      tracing:
        patterns: ['tracing*']
    ignore:
      # A rusqlite bump changes the bundled SQLite version, which changes the
      # file format's write behaviour. Deliberate, not automatic.
      - dependency-name: rusqlite
        update-types: ['version-update:semver-major']

  # Every `uses:` in this repository is pinned to a commit with the tag it
  # belonged to in a trailing comment. Dependabot reads that comment, so the pin
  # is maintained here rather than by hand — which is the only reason pinning to
  # a commit is affordable at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for a month of action bumps. They are reviewed by reading the
      # diff of what each pin now points at, and that reads better in one place.
      actions:
        patterns: ['*']
